services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: sampark
      POSTGRES_PASSWORD: sampark_local_only
      POSTGRES_DB: sampark
    ports: ["127.0.0.1:5439:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sampark"]
      interval: 5s
      retries: 10
  minio:
    image: cgr.dev/chainguard/minio@sha256:fb893e36fc369d41e92f678b17ec27378fa5bf0576aeef7ac15460c13629ab5a
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: local_sampark
      MINIO_ROOT_PASSWORD: local_sampark_change_me
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio_data:/data"]
  clamav:
    image: clamav/clamav:1.4
    platform: linux/amd64
    ports: ["127.0.0.1:3310:3310"]
    volumes: ["clamav_data:/var/lib/clamav"]
  # Development mail catcher: the worker delivers here, nothing leaves the
  # machine. Inbox at http://127.0.0.1:8025.
  mailpit:
    image: axllent/mailpit:v1.33.0
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
volumes:
  postgres_data:
  minio_data:
  clamav_data:
